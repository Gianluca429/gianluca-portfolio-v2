<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/" aria-label="Gianluca Guarino, torna alla homepage">
      <span class="brand__mark" aria-hidden="true">G</span>
      <span>GIANLUCA <b>GUARINO</b><small>FRONT-END · WEB DESIGN</small></span>
    </a>

    <nav class="header__links" aria-label="Navigazione principale">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
      <a routerLink="/projects" routerLinkActive="is-active" ariaCurrentWhenActive="page">Progetti</a>
      <a routerLink="/metodo" routerLinkActive="is-active" ariaCurrentWhenActive="page">Metodo</a>
      <a routerLink="/" fragment="contact">Contatti</a>
    </nav>

    <a class="header__cta" routerLink="/" fragment="contact">Parliamone ↗</a>

    <details class="menu" #mobileMenu>
      <summary aria-label="Apri il menu di navigazione">☰</summary>
      <nav aria-label="Navigazione mobile">
        <a routerLink="/" (click)="mobileMenu.open = false">Home</a>
        <a routerLink="/projects" (click)="mobileMenu.open = false">Progetti</a>
        <a routerLink="/metodo" (click)="mobileMenu.open = false">Metodo</a>
        <a routerLink="/" fragment="contact" (click)="mobileMenu.open = false">Contatti</a>
      </nav>
    </details>
  </div>
</header>
